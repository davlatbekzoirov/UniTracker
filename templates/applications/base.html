<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}UniTracker{% endblock %}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f1; color: #1a1a1a; font-size: 15px; line-height: 1.6; }
  a { color: #534AB7; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Nav */
  .nav { background: #fff; border-bottom: 1px solid #e5e3dd; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 10; }
  .nav-brand { font-size: 16px; font-weight: 600; color: #534AB7; letter-spacing: -.01em; }
  .nav-links { display: flex; gap: 4px; align-items: center; }
  .nav-links a { padding: 6px 12px; border-radius: 6px; font-size: 14px; color: #555; }
  .nav-links a:hover { background: #f5f4f1; text-decoration: none; color: #1a1a1a; }
  .nav-links a.active { background: #EEEDFE; color: #3C3489; }
  .nav-user { font-size: 13px; color: #888; }

  /* Layout */
  .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .page-title { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }

  /* Cards */
  .card { background: #fff; border: 1px solid #e5e3dd; border-radius: 12px; padding: 1.25rem 1.5rem; }
  .card + .card { margin-top: 1rem; }

  /* Stat grid */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 2rem; }
  .stat { background: #fff; border: 1px solid #e5e3dd; border-radius: 10px; padding: 1rem; }
  .stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .stat-value { font-size: 28px; font-weight: 600; line-height: 1; }
  .stat-sub { font-size: 12px; color: #aaa; margin-top: 3px; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #888; padding: 8px 12px; border-bottom: 1px solid #e5e3dd; }
  td { padding: 11px 12px; border-bottom: 1px solid #f0ede8; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafaf8; }

  /* Badges */
  .badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
  .badge-preparing { background: #FAEEDA; color: #633806; }
  .badge-submitted { background: #EEEDFE; color: #3C3489; }
  .badge-interview { background: #E1F5EE; color: #085041; }
  .badge-accepted  { background: #EAF3DE; color: #27500A; }
  .badge-rejected  { background: #FCEBEB; color: #791F1F; }
  .badge-deferred  { background: #E6F1FB; color: #0C447C; }
  .badge-reach  { background: #FAEEDA; color: #633806; }
  .badge-match  { background: #EEEDFE; color: #3C3489; }
  .badge-safety { background: #E1F5EE; color: #085041; }
  .badge-urgent { background: #FCEBEB; color: #A32D2D; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all .15s; text-decoration: none; }
  .btn:hover { text-decoration: none; }
  .btn-primary { background: #534AB7; color: #fff; border-color: #534AB7; }
  .btn-primary:hover { background: #3C3489; border-color: #3C3489; }
  .btn-outline { background: #fff; color: #333; border-color: #d6d3cc; }
  .btn-outline:hover { background: #f5f4f1; }
  .btn-danger { background: #fff; color: #A32D2D; border-color: #f0c0c0; }
  .btn-danger:hover { background: #FCEBEB; }
  .btn-sm { padding: 4px 10px; font-size: 13px; }

  /* Forms */
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 4px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 9px 12px; border: 1px solid #d6d3cc; border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff; color: #1a1a1a;
    transition: border-color .15s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #534AB7; box-shadow: 0 0 0 3px rgba(83,74,183,.12);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-section { margin-bottom: 1.5rem; }
  .form-section-title { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .75rem; padding-bottom: .5rem; border-bottom: 1px solid #e5e3dd; }
  .errorlist { list-style: none; color: #A32D2D; font-size: 13px; margin-top: 4px; }

  /* Messages */
  .messages { margin-bottom: 1rem; }
  .message { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 6px; }
  .message-success { background: #EAF3DE; color: #27500A; border: 1px solid #c0dd97; }
  .message-error { background: #FCEBEB; color: #791F1F; border: 1px solid #f7c1c1; }

  /* Filters */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
  .filter-bar input[type=text] { padding: 7px 12px; border: 1px solid #d6d3cc; border-radius: 8px; font-size: 14px; min-width: 200px; }
  .filter-chip { padding: 5px 12px; border-radius: 20px; font-size: 13px; border: 1px solid #d6d3cc; background: #fff; cursor: pointer; color: #555; text-decoration: none; }
  .filter-chip:hover { background: #f5f4f1; text-decoration: none; }
  .filter-chip.active { background: #EEEDFE; border-color: #9C97E8; color: #3C3489; }

  /* Empty state */
  .empty { text-align: center; padding: 3rem 1rem; color: #aaa; }
  .empty-icon { font-size: 40px; margin-bottom: .75rem; }
  .empty p { font-size: 15px; }

  /* Deadline urgency */
  .days-urgent { color: #A32D2D; font-weight: 500; }
  .days-soon { color: #854F0B; }

  /* Score bars */
  .score-bar { height: 6px; background: #f0ede8; border-radius: 3px; margin-top: 4px; }
  .score-fill { height: 6px; border-radius: 3px; background: #534AB7; }
  .score-fill-green { background: #1D9E75; }
  .score-fill-blue { background: #378ADD; }
</style>
</head>
<body>
{% if user.is_authenticated %}
<nav class="nav">
  <span class="nav-brand">🎓 UniTracker</span>
  <div class="nav-links">
    <a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
    <a href="{% url 'university_list' %}" {% if 'university' in request.resolver_match.url_name %}class="active"{% endif %}>Universities</a>
    <a href="{% url 'scholarship_list' %}" {% if 'scholarship' in request.resolver_match.url_name %}class="active"{% endif %}>Scholarships</a>
    <a href="{% url 'documents' %}" {% if request.resolver_match.url_name == 'documents' %}class="active"{% endif %}>Documents</a>
    <a href="{% url 'scores' %}" {% if request.resolver_match.url_name == 'scores' %}class="active"{% endif %}>Scores</a>
  </div>
  <div class="nav-user">{{ user.username }} · <a href="{% url 'logout' %}">Sign out</a></div>
</nav>
{% endif %}

<div class="container">
  {% if messages %}
  <div class="messages">
    {% for m in messages %}
    <div class="message message-{% if m.tags == 'error' %}error{% else %}success{% endif %}">{{ m }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
